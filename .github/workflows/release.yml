name: Release executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Tag releases attest SLSA build provenance for every archive and SHA256SUMS
# (releases published after this workflow change). Verify downloads with
# GitHub CLI 2.49+, replacing vX.Y.Z and the target:
#   gh attestation verify kitmux-vX.Y.Z-linux-x86_64.tar.gz \
#     --repo cleisson-labs/kitmux \
#     --signer-workflow cleisson-labs/kitmux/.github/workflows/release.yml \
#     --source-ref refs/tags/vX.Y.Z
#   gh attestation verify SHA256SUMS --repo cleisson-labs/kitmux \
#     --signer-workflow cleisson-labs/kitmux/.github/workflows/release.yml \
#     --source-ref refs/tags/vX.Y.Z

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Qualify ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x86_64
          - runner: ubuntu-22.04
            target: linux-x86_64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^#define KM_VERSION "\([^"]*\)"/\1/p' include/kitmux.h)
          tag="v$version"
          if [ "$EVENT_NAME" = push ] && [ "$REF_NAME" != "$tag" ]; then
            echo 'Tag does not match source version' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf json-c libyaml ncurses openssl
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libjson-c-dev libyaml-dev libncurses-dev libssl-dev perl curl ca-certificates file binutils
      - name: Test
        run: make -j2 test
      - name: Address and undefined behavior sanitizers
        env:
          ASAN_OPTIONS: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' && 'detect_leaks=0' || '' }}
        run: make -j2 sanitize
      - name: ARM64 Linux leak checks
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: sh scripts/check-leaks.sh "$PWD/build-sanitize/kitmux"
      - name: Build standalone release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: make release VERSION="$RELEASE_TAG"
      - name: Extract packaged executable
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/kitmux-smoke"
          tar -xzf "dist/kitmux-$RELEASE_TAG-$TARGET.tar.gz" -C "$RUNNER_TEMP/kitmux-smoke"
      - name: macOS smoke without Homebrew access
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          sandbox-exec -p '(version 1)(allow default)(deny file-read* (subpath "/opt/homebrew") (subpath "/usr/local/opt") (subpath "/usr/local/Cellar"))' \
            sh scripts/smoke-release.sh "$RUNNER_TEMP/kitmux-smoke/kitmux-$RELEASE_TAG-$TARGET/kitmux"
      - name: Linux smoke without development libraries
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$RUNNER_TEMP/kitmux-smoke:/artifact:ro" ubuntu:22.04 \
            "/artifact/kitmux-$RELEASE_TAG-$TARGET/kitmux" --version
          docker build -t kitmux-release-smoke - < scripts/release-smoke.Dockerfile
          docker run --rm --init -v "$PWD:/work:ro" -v "$RUNNER_TEMP/kitmux-smoke:/artifact:ro" -w /work \
            kitmux-release-smoke sh scripts/smoke-release.sh "/artifact/kitmux-$RELEASE_TAG-$TARGET/kitmux"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitmux-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  assets:
    name: Assemble verified release assets
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kitmux-*
          path: dist
          merge-multiple: true
      - name: Verify all targets and checksum
        run: |
          version=$(sed -n 's/^#define KM_VERSION "\([^"]*\)"/\1/p' include/kitmux.h)
          cd dist || exit 1
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 4
          for target in darwin-arm64 darwin-x86_64 linux-arm64 linux-x86_64; do
            test -s "kitmux-v$version-$target.tar.gz"
          done
          sha256sum kitmux-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitmux-release-assets
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest release provenance
    needs: assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kitmux-release-assets
          path: dist
      - name: Verify checksums before signing
        run: |
          cd dist || exit 1
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

  publish:
    name: Publish complete release
    needs: attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kitmux-release-assets
          path: dist
      - name: Upload draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist || exit 1
          sha256sum -c SHA256SUMS
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            test "$draft" = true || { echo 'Refusing to replace a published release' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Kitmux $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
