name: Build and verify release assets

on:
  workflow_call:
    inputs:
      native-tests:
        description: Run native tests, sanitizers and leak checks when the caller has no equivalent matrix
        type: boolean
        default: true
    outputs:
      artifact-id:
        description: Verified release bundle
        value: ${{ jobs.assets.outputs.artifact-id }}

permissions: {}

jobs:
  build:
    name: Qualify ${{ matrix.target }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x86_64
          - runner: ubuntu-22.04
            target: linux-x86_64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^#define KM_VERSION "\([^"]*\)"/\1/p' include/kitmux.h)
          tag="v$version"
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ] && [ "$REF_NAME" != "$tag" ]; then
            echo 'Tag does not match source version' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf json-c libyaml ncurses openssl
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libjson-c-dev libyaml-dev libncurses-dev libssl-dev perl curl ca-certificates file binutils
      - name: Test
        if: inputs.native-tests
        run: make -j2 test
      - name: Address and undefined behavior sanitizers
        if: inputs.native-tests
        env:
          ASAN_OPTIONS: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' && 'detect_leaks=0' || '' }}
        run: make -j2 sanitize
      - name: ARM64 Linux leak checks
        if: inputs.native-tests && runner.os == 'Linux' && runner.arch == 'ARM64'
        run: sh scripts/check-leaks.sh "$PWD/build-sanitize/kitmux"
      - name: Build standalone release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: make release VERSION="$RELEASE_TAG"
      - name: Extract packaged executable
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/kitmux-smoke"
          tar -xzf "dist/kitmux-$RELEASE_TAG-$TARGET.tar.gz" -C "$RUNNER_TEMP/kitmux-smoke"
      - name: macOS smoke without Homebrew access
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          sandbox-exec -p '(version 1)(allow default)(deny file-read* (subpath "/opt/homebrew") (subpath "/usr/local/opt") (subpath "/usr/local/Cellar"))' \
            sh scripts/smoke-release.sh "$RUNNER_TEMP/kitmux-smoke/kitmux-$RELEASE_TAG-$TARGET/kitmux"
      - name: Linux smoke without development libraries
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$RUNNER_TEMP/kitmux-smoke:/artifact:ro" ubuntu:22.04 \
            "/artifact/kitmux-$RELEASE_TAG-$TARGET/kitmux" --version
          docker build -t kitmux-release-smoke - < scripts/release-smoke.Dockerfile
          docker run --rm --init -v "$PWD:/work:ro" -v "$RUNNER_TEMP/kitmux-smoke:/artifact:ro" -w /work \
            kitmux-release-smoke sh scripts/smoke-release.sh "/artifact/kitmux-$RELEASE_TAG-$TARGET/kitmux"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-part-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' && 3 || 0 }}
          compression-level: 0
          overwrite: true

  assets:
    needs: build
    permissions:
      contents: read
    uses: cleisson-labs/.github/.github/workflows/release-assets.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      combined-checksums: true
      assets: |
        kitmux-${{ needs.build.outputs.tag }}-darwin-arm64.tar.gz
        kitmux-${{ needs.build.outputs.tag }}-darwin-x86_64.tar.gz
        kitmux-${{ needs.build.outputs.tag }}-linux-arm64.tar.gz
        kitmux-${{ needs.build.outputs.tag }}-linux-x86_64.tar.gz
